spring:
  application:
    name: goerp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goerp}
    username: ${DB_USERNAME:goerp}
    password: ${DB_PASSWORD:goerp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

goerp:
  seguranca:
    segredo-jwt: ${JWT_SECRET:}
    validade-do-acesso: 15m
    validade-da-renovacao: 7d
