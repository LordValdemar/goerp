services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-goerp}
      POSTGRES_USER: ${DB_USERNAME:-goerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goerp}
    ports:
      - "${DB_PORTA:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-goerp} -d ${DB_NAME:-goerp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-goerp}
      DB_USERNAME: ${DB_USERNAME:-goerp}
      DB_PASSWORD: ${DB_PASSWORD:-goerp}
      # Obrigatória: a aplicação não sobe sem ela (mínimo 32 caracteres). Defina no arquivo .env
      JWT_SECRET: ${JWT_SECRET:-}
      GOERP_ADMIN_NOME: ${GOERP_ADMIN_NOME:-}
      GOERP_ADMIN_EMAIL: ${GOERP_ADMIN_EMAIL:-}
      GOERP_ADMIN_SENHA: ${GOERP_ADMIN_SENHA:-}
    ports:
      - "8080:8080"

  # Backup automático: pg_dump compactado, com rotação (dias / semanas / meses).
  # Arquivos em ./backups (last/, daily/, weekly/, monthly/). Copie a pasta para fora do servidor
  # (outro disco, nuvem): backup no mesmo servidor não protege contra perda do servidor.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-goerp}
      POSTGRES_USER: ${DB_USERNAME:-goerp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goerp}
      POSTGRES_EXTRA_OPTS: "-Z6 --no-owner --no-privileges"
      BACKUP_SUFFIX: ".sql.gz"
      SCHEDULE: ${BACKUP_AGENDA:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_MANTER_DIAS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_MANTER_SEMANAS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_MANTER_MESES:-6}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${BACKUP_PASTA:-./backups}:/backups

volumes:
  pgdata:
